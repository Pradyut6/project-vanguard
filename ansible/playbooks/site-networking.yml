---
- name: Configure Ubuntu 24.04 System Networking & UFW Firewall Hardening
  hosts: vanguard_cluster
  gather_facts: true
  tasks:
    - name: Ensure Linux networking and diagnostic packages are installed
      ansible.builtin.apt:
        name:
          - iproute2
          - tcpdump
          - net-tools
          - ethtool
          - ufw
          - curl
          - jq
        state: present
        update_cache: true

    - name: Tune Linux kernel sysctl parameters for container networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-vanguard-networking.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.ipv4.conf.all.forwarding = 1
          fs.inotify.max_user_watches = 524288
          fs.inotify.max_user_instances = 512
      notify: Reload sysctl

    - name: Create internal VXLAN overlay simulation interface (vxlan0) with tuned MTU
      ansible.builtin.shell: |
        if ! ip link show vxlan0 >/dev/null 2>&1; then
          ip link add vxlan0 type dummy
        fi
        ip link set dev vxlan0 mtu {{ overlay_mtu }} up
      changed_when: false

    - name: Allow SSH traffic before enabling UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow all traffic within the internal cluster bridge subnet (10.240.0.0/24)
      community.general.ufw:
        rule: allow
        from_ip: "{{ cluster_subnet }}"

    - name: Allow Kubernetes API Server and Application Ingress ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"
        - "8000"
        - "16443"

    - name: Enable UFW firewall with default deny incoming policy
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      failed_when: false