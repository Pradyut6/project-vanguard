---
- name: Ubuntu 24.04 LTS Lifecycle Management, Security Pinning & Patch Governance
  hosts: vanguard_cluster
  gather_facts: true
  tasks:
    - name: Ensure unattended-upgrades and apt-listchanges are installed
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: true

    - name: Configure Ubuntu 24.04 (Noble) security-only unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades-vanguard
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::Package-Blacklist {
              "openssh-server";
              "ufw";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";

    - name: Pin critical network and SSH packages against unintended major upgrades (apt-mark hold)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - openssh-server
        - ufw
        - iproute2

    - name: Collect held packages list
      ansible.builtin.command: apt-mark showhold
      register: held_pkgs
      changed_when: false

    - name: Write Ubuntu LTS lifecycle compliance report on each node
      ansible.builtin.copy:
        dest: /var/log/vanguard-lifecycle-audit.json
        mode: "0644"
        content: |
          {
            "hostname": "{{ ansible_hostname }}",
            "distribution": "{{ ansible_distribution }} {{ ansible_distribution_version }}",
            "kernel": "{{ ansible_kernel }}",
            "held_packages": {{ held_pkgs.stdout_lines | to_json }}
          }

    - name: Display node lifecycle compliance status
      ansible.builtin.debug:
        msg: "Node {{ ansible_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }}, Kernel {{ ansible_kernel }}) pinned packages: {{ held_pkgs.stdout_lines }}"