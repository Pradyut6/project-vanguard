apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-s3-pvc
  namespace: vanguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vanguard-block-storage
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vanguard-minio
  namespace: vanguard
spec:
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: vanguard-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-minio
  namespace: vanguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanguard-minio
  template:
    metadata:
      labels:
        app: vanguard-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: vanguard-s3-secret
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-s3-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-s3-backup
  namespace: vanguard
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup-runner
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: vanguard-db-secret
                - secretRef:
                    name: vanguard-s3-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache ca-certificates wget curl libc6-compat >/dev/null
                  echo "=== 1. Dumping PostgreSQL database ==="
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/tmp/vanguard-db-${TIMESTAMP}.sql.gz"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h vanguard-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$BACKUP_FILE"

                  echo "=== 2. Downloading MinIO Client & Uploading to S3 ==="
                  wget -q https://dl.minio.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  mc alias set s3 http://vanguard-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  mc mb --ignore-existing s3/vanguard-backups
                  mc cp "$BACKUP_FILE" s3/vanguard-backups/
                  echo "=== 3. Verifying Object in S3 Bucket ==="
                  mc ls s3/vanguard-backups/