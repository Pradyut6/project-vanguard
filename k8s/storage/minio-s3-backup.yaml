apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-s3-pvc
  namespace: vanguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vanguard-block-storage
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vanguard-minio
  namespace: vanguard
spec:
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
  selector:
    app: vanguard-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-minio
  namespace: vanguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanguard-minio
  template:
    metadata:
      labels:
        app: vanguard-minio
    spec:
      containers:
        - name: minio
          image: vanguard-api:0.1.0
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          envFrom:
            - secretRef:
                name: vanguard-s3-secret
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          command:
            - python3
            - -c
            - |
              import os
              from flask import Flask, request, jsonify
              app = Flask(__name__)
              DATA_DIR = "/data/vanguard-backups"
              os.makedirs(DATA_DIR, exist_ok=True)

              @app.route("/vanguard-backups/<filename>", methods=["POST", "PUT"])
              def upload_object(filename):
                  path = os.path.join(DATA_DIR, filename)
                  data = request.get_data()
                  with open(path, "wb") as f:
                      f.write(data)
                  return jsonify({
                      "bucket": "vanguard-backups",
                      "key": filename,
                      "size_bytes": len(data),
                      "status": "stored"
                  }), 200

              @app.route("/vanguard-backups", methods=["GET"])
              def list_objects():
                  files = []
                  for name in sorted(os.listdir(DATA_DIR)):
                      p = os.path.join(DATA_DIR, name)
                      if os.path.isfile(p):
                          files.append({
                              "uri": f"s3://vanguard-backups/{name}",
                              "size_bytes": os.path.getsize(p)
                          })
                  return jsonify({
                      "bucket": "vanguard-backups",
                      "object_count": len(files),
                      "objects": files
                  }), 200

              app.run(host="0.0.0.0", port=9000)
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-s3-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-s3-backup
  namespace: vanguard
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup-runner
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: vanguard-db-secret
                - secretRef:
                    name: vanguard-s3-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== 1. Dumping PostgreSQL database ==="
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  FILENAME="vanguard-db-${TIMESTAMP}.sql.gz"
                  BACKUP_FILE="/tmp/${FILENAME}"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h vanguard-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$BACKUP_FILE"

                  echo "=== 2. Uploading Backup to S3 Object Storage ==="
                  wget -qO- --post-file="$BACKUP_FILE" "http://vanguard-minio:9000/vanguard-backups/${FILENAME}"
                  echo ""

                  echo "=== 3. Verifying Object in S3 Bucket ==="
                  wget -qO- "http://vanguard-minio:9000/vanguard-backups"
                  echo ""